[project]
name = "arbor-backend"
version = "0.2.0"
description = "FastAPI backend for Arbor coronary angiography analysis"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "pillow>=10.4,<13.0",
    "numpy>=2.0,<3.0",
    "opencv-python-headless>=4.10,<5.0",
    "python-dotenv>=1.2.3",
    "segmentation-models-pytorch==0.5.0",
]

[tool.uv]
dev-dependencies = []
